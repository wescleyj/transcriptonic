<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>CommitJr Atas | Transcrição ao Vivo</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Poppins:wght@400;500;600;700&display=swap");

        :root {
            --cj-navy: #0c152d;
            --cj-surface: #132042;
            --cj-surface-alt: #16254c;
            --cj-border: #233564;
            --cj-yellow: #fac835;
            --cj-mint: #95eed8;
            --cj-white: #ffffff;
            --cj-muted: #b8c2d9;
        }

        html {
            scroll-behavior: smooth;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Poppins", system-ui, -apple-system, sans-serif;
            background-color: var(--cj-navy);
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 28px 28px;
            color: var(--cj-white);
            display: flex;
            flex-direction: column;
            height: 100vh;
            accent-color: var(--cj-yellow);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--cj-surface);
            padding: 12px 16px;
            border-bottom: 2px solid var(--cj-yellow);
        }

        .mascot-badge {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--cj-navy);
            border: 1.5px solid var(--cj-yellow);
            border-radius: 8px;
            padding: 4px;
        }

        .mascot-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .header-text {
            min-width: 0;
            flex: 1;
        }

        .brand-mini {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--cj-white);
            margin-bottom: 2px;
        }

        .brand-mini .jr {
            color: var(--cj-yellow);
        }

        .brand-mini .tag {
            font-family: "JetBrains Mono", monospace;
            font-weight: 600;
            color: var(--cj-mint);
            margin-left: 4px;
        }

        h1 {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            color: var(--cj-white);
            outline: none;
            border-radius: 4px;
        }

        h1:focus {
            box-shadow: 0 0 0 1px var(--cj-yellow);
            padding: 2px 4px;
        }

        /* Main scroll container */
        #transcript-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: transparent;
        }

        .transcript-block {
            margin-bottom: 12px;
            padding: 10px 12px;
            background: var(--cj-surface);
            border: 1px solid var(--cj-border);
            border-left: 3px solid var(--cj-yellow);
            border-radius: 8px;
        }

        .block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            font-size: 12px;
        }

        .speaker-name {
            color: var(--cj-yellow);
            font-weight: 700;
        }

        .block-time {
            font-family: "JetBrains Mono", monospace;
            color: var(--cj-mint);
            font-size: 11px;
        }

        .block-text {
            margin: 0;
            font-size: 13.5px;
            line-height: 1.5;
            color: var(--cj-muted);
            word-break: break-word;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="mascot-badge">
            <img src="../icons/pull-mascot.svg" alt="Pull - Mascote Commit Jr." />
        </div>
        <div class="header-text">
            <div class="brand-mini">Commit<span class="jr">Jr</span> <span class="tag">&lt;Ao Vivo/&gt;</span></div>
            <h1 id="meeting-title">Transcrição da Reunião</h1>
        </div>
    </div>

    <div id="transcript-container"></div>

    <script src="side-panel.js"></script>
</body>

</html>
