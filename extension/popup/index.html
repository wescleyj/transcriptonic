<!-- popup/index.html -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>CommitJr Atas</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Poppins:wght@400;500;600;700&display=swap");

    :root {
      --cj-navy: #0c152d;
      --cj-surface: #132042;
      --cj-surface-alt: #16254c;
      --cj-border: #233564;
      --cj-border-strong: #2f4682;
      --cj-yellow: #fac835;
      --cj-yellow-hover: #ffd65c;
      --cj-mint: #95eed8;
      --cj-coral: #f69191;
      --cj-white: #ffffff;
      --cj-muted: #b8c2d9;
      --cj-subtle: #8fa0c4;
      --cj-grey: #515151;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 436px;
      margin: 0;
      padding: 1rem 1.1rem;
      background-color: var(--cj-navy);
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--cj-white);
      font-family: "Poppins", system-ui, -apple-system, sans-serif;
      font-size: 0.84rem;
      line-height: 1.45;
    }

    .brand-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      padding: 0.85rem 1rem;
      margin-bottom: 0.9rem;
      background: var(--cj-surface);
      border: 1px solid var(--cj-border);
      border-left: 3px solid var(--cj-yellow);
      border-radius: 8px;
    }

    .brand-header::after {
      content: "";
      position: absolute;
      top: 6px;
      right: 6px;
      width: 10px;
      height: 10px;
      border-top: 2px solid var(--cj-yellow);
      border-right: 2px solid var(--cj-yellow);
      border-top-right-radius: 2px;
      pointer-events: none;
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.2rem;
    }

    h1.brand-wordmark {
      margin: 0;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--cj-white);
    }

    h1.brand-wordmark .jr {
      color: var(--cj-yellow);
    }

    .brand-badge {
      display: inline-block;
      padding: 0.12rem 0.42rem;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--cj-mint);
      background: rgba(149, 238, 216, 0.1);
      border: 1px solid rgba(149, 238, 216, 0.35);
      border-radius: 4px;
    }

    .brand-subtitle {
      margin: 0;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.72rem;
      color: var(--cj-mint);
      opacity: 0.92;
    }

    .mascot-frame {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cj-navy);
      border: 1.5px solid var(--cj-yellow);
      border-radius: 10px;
      padding: 5px;
    }

    .logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .card {
      padding: 0.9rem 1rem;
      background: var(--cj-surface);
      border: 1px solid var(--cj-border);
      border-radius: 8px;
      margin-bottom: 0.85rem;
      text-align: left;
    }

    .card-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      padding-left: 0.55rem;
      border-left: 3px solid var(--cj-yellow);
      margin-bottom: 0.65rem;
    }

    .card-title {
      font-weight: 600;
      font-size: 0.83rem;
      color: var(--cj-white);
      white-space: nowrap;
    }

    #gemini-key-status {
      white-space: nowrap;
      font-size: 0.72rem;
    }

    .checkbox-group {
      display: flex;
      gap: 0.55rem;
      align-items: center;
    }

    .checkbox-group label {
      margin: 0;
      font-weight: 500;
      color: var(--cj-white);
      cursor: pointer;
    }

    .sub-text {
      color: var(--cj-muted);
      font-size: 0.76rem;
    }

    input[type="checkbox"] {
      accent-color: var(--cj-yellow);
      width: 17px;
      height: 17px;
      margin: 0;
      cursor: pointer;
      flex-shrink: 0;
    }

    input[type="password"],
    input[type="text"],
    select {
      width: 100%;
      padding: 0.48rem 0.65rem;
      border: 1px solid var(--cj-border-strong);
      border-radius: 6px;
      background: var(--cj-navy);
      color: var(--cj-white);
      font-family: "Poppins", system-ui, -apple-system, sans-serif;
      font-size: 0.8rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input[type="password"]::placeholder,
    input[type="text"]::placeholder {
      color: var(--cj-subtle);
    }

    input[type="password"]:focus,
    input[type="text"]:focus,
    select:focus {
      border-color: var(--cj-yellow);
    }

    select option {
      background: var(--cj-navy);
      color: var(--cj-white);
    }

    .gemini-row {
      display: flex;
      gap: 0.45rem;
      align-items: center;
    }

    .gemini-row input {
      flex: 1;
    }

    .gemini-field {
      margin-top: 0.75rem;
    }

    .field-label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: 500;
      font-size: 0.78rem;
      color: var(--cj-muted);
    }

    .gemini-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.85rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--cj-border);
    }

    a {
      color: var(--cj-mint);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    a:hover {
      color: var(--cj-yellow);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    button {
      font-family: "Poppins", system-ui, -apple-system, sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 6px;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .btn-primary {
      background: var(--cj-yellow);
      color: var(--cj-navy);
      border: 1px solid var(--cj-yellow);
      padding: 0.48rem 0.85rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--cj-yellow-hover);
      border-color: var(--cj-yellow-hover);
    }

    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-outline {
      background: transparent;
      color: var(--cj-coral);
      border: 1px solid rgba(246, 145, 145, 0.55);
      padding: 0.45rem 0.7rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .btn-outline:hover:not(:disabled) {
      background: rgba(246, 145, 145, 0.12);
      border-color: var(--cj-coral);
    }

    .status-ok {
      color: var(--cj-mint);
      font-weight: 600;
    }

    .status-err {
      color: var(--cj-coral);
      font-weight: 600;
    }

    .footer-bar {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      padding: 0.2rem 0.15rem 0;
    }

    .footer-meta {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.73rem;
      color: var(--cj-subtle);
    }

    .right-arrow {
      font-size: 0.9em;
    }
  </style>
</head>

<body>
  <header class="brand-header">
    <div class="header-text">
      <div class="brand-title-row">
        <h1 class="brand-wordmark">Commit<span class="jr">Jr</span></h1>
        <span class="brand-badge">ATAS</span>
      </div>
      <p class="brand-subtitle">&lt;Transcrições &amp; Atas • Google Meet/&gt;</p>
    </div>
    <div class="mascot-frame">
      <img class="logo" src="../icons/pull-mascot.svg" alt="Pull - Mascote Commit Jr." />
    </div>
  </header>

  <section class="card">
    <div class="checkbox-group">
      <input type="checkbox" id="hide-captions" />
      <label for="hide-captions">Ocultar legendas na tela do Google Meet</label>
    </div>
  </section>

  <section class="card" id="gemini-ata-card">
    <div class="card-title-row">
      <span class="card-title">Ata de Reunião (Gemini AI)</span>
      <span id="gemini-key-status" class="sub-text">Chave não configurada</span>
    </div>

    <div class="gemini-row">
      <input type="password" id="gemini-api-key" placeholder="Cole sua chave API do Google Gemini (AIza...)" autocomplete="off" />
      <button type="button" id="save-gemini-key" class="btn-primary">Salvar</button>
      <button type="button" id="clear-gemini-key" class="btn-outline" style="display: none;">Remover</button>
    </div>

    <div class="gemini-field">
      <label class="field-label" for="gemini-model">Modelo Gemini</label>
      <select id="gemini-model">
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (Mais econômico / recomendado)</option>
        <option value="gemini-3.5-flash">Gemini 3.5 Flash (Equilibrado)</option>
        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
        <option value="gemini-3-flash-preview">Gemini 3 Flash Preview</option>
        <option value="gemini-3.1-flash-lite-preview">Gemini 3.1 Flash-Lite Preview</option>
      </select>
    </div>

    <div class="checkbox-group gemini-field">
      <input type="checkbox" id="auto-generate-ata" />
      <label for="auto-generate-ata">Gerar ata automaticamente ao final da reunião</label>
    </div>

    <div class="gemini-actions">
      <button type="button" id="generate-last-ata-btn" class="btn-primary">Gerar Ata da última reunião</button>
      <a href="../meetings.html#ata-settings" target="_blank">Modelo &amp; Atas <span class="right-arrow">&rarr;</span></a>
    </div>
    <div id="ata-action-status" class="sub-text" style="margin-top: 0.55rem;"></div>
  </section>

  <footer class="footer-bar">
    <a href="../meetings.html" target="_blank">Histórico de reuniões <span class="right-arrow">&rarr;</span></a>
    <div class="footer-meta">
      <span id="version"></span>
      <span>•</span>
      <span>Commit Jr.</span>
    </div>
  </footer>

  <script src="popup.js"></script>
</body>

</html>
