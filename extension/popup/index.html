<!-- popup.html -->
<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>TranscripTonic</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=TASA+Explorer:wght@400;700&?family=SUSE:wght@700&display=swap");

    body {
      width: 440px;
      padding: 1.25rem;
      background: #071f29;
      color: #C0C0C0;
      font-family: "TASA Explorer", sans-serif;
      font-size: 0.875rem;
    }

    h1 {
      font-size: 2rem;
      margin: 0;
    }

    .header {
      margin-bottom: 1.25rem;
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-description {
      margin: 0;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 96px;
    }

    .get-started {
      padding: 1rem;
      background-color: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(4px);
      border-radius: 8px;
      margin-bottom: 1rem;
      text-align: left;
    }

    .platform-toggles {
      display: flex;
      gap: 2rem;
    }

    .checkbox-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    ul {
      padding-inline-start: 20px;
    }

    p {
      margin-bottom: 0;
    }

    .radio-item {
      display: flex;
      gap: 0.5rem;
      align-items: start;
      margin-bottom: 1rem;
    }

    .sub-text {
      color: #a0a0a0;
      font-size: 0.8rem;
    }

    input[type="checkbox"],
    input[type="radio"] {
      margin-top: 0.15rem;
      accent-color: #2A9ACA;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    input[type="password"],
    input[type="text"],
    select {
      padding: 0.45rem 0.6rem;
      border: 1px solid #2A9ACA;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: #E0E0E0;
      font-family: "TASA Explorer", sans-serif;
      font-size: 0.85rem;
      box-sizing: border-box;
    }

    select option {
      background: #071f29;
      color: #E0E0E0;
    }

    .gemini-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.5rem;
    }

    .gemini-row input {
      flex: 1;
    }

    .gemini-field {
      margin-top: 0.75rem;
    }

    .gemini-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    label {
      margin: 0;
      margin-bottom: 0.25rem;
      cursor: pointer;
    }

    a {
      color: #2A9ACA;
      font-weight: bold;
      text-underline-offset: 4px;
    }

    button {
      color: #2A9ACA;
      font-weight: bold;
      text-decoration: underline;
      text-underline-offset: 4px;
      font-family: "TASA Explorer", sans-serif;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .btn-primary {
      background: #2A9ACA;
      color: #071f29;
      text-decoration: none;
      padding: 0.45rem 0.85rem;
      border-radius: 4px;
      font-weight: bold;
      white-space: nowrap;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-outline {
      background: transparent;
      color: #2A9ACA;
      border: 1px solid #2A9ACA;
      text-decoration: none;
      padding: 0.4rem 0.75rem;
      border-radius: 4px;
      font-weight: bold;
    }

    .status-ok {
      color: #4CAF50;
    }

    .status-err {
      color: #f44336;
    }

    .footer {
      margin-bottom: 0.25rem;
      display: flex;
      gap: 1.5rem;
      align-items: center;
      justify-content: space-between;
    }

    .right-arrow {
      font-family: "SUSE", sans-serif;
      font-size: small;
    }
  </style>
</head>

<body>
  <div>
    <div class="header">
      <div class="header-content">
        <div class="header-text">
          <h1>TranscripTonic</h1>
          <p class="header-description sub-text">
            Transcrições automáticas no Google Meet.
          </p>
        </div>
        <img class="logo" src="./../icon.png" alt="Extension icon" />
      </div>
    </div>

    <div class="get-started">
      <div class="checkbox-group">
        <input type="checkbox" id="hide-captions" />
        <label for="hide-captions"><b>Ocultar legendas na tela do Google Meet</b></label>
      </div>
    </div>

    <div class="get-started" id="gemini-ata-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <b>Ata de Reunião (Google Gemini AI)</b>
        <span id="gemini-key-status" class="sub-text">Chave não configurada</span>
      </div>

      <div class="gemini-row">
        <input type="password" id="gemini-api-key" placeholder="Cole sua chave API do Google Gemini (AIza...)" autocomplete="off" />
        <button type="button" id="save-gemini-key" class="btn-primary">Salvar</button>
        <button type="button" id="clear-gemini-key" class="btn-outline" style="display: none;">Remover</button>
      </div>

      <div class="gemini-field">
        <label for="gemini-model" style="display: block; margin-bottom: 0.25rem;"><b>Modelo Gemini:</b></label>
        <select id="gemini-model" style="width: 100%;">
          <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (Mais econômico / recomendado)</option>
          <option value="gemini-3.5-flash">Gemini 3.5 Flash (Equilibrado)</option>
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
          <option value="gemini-3-flash-preview">Gemini 3 Flash Preview</option>
          <option value="gemini-3.1-flash-lite-preview">Gemini 3.1 Flash-Lite Preview</option>
        </select>
      </div>

      <div class="checkbox-group gemini-field">
        <input type="checkbox" id="auto-generate-ata" />
        <label for="auto-generate-ata"><b>Gerar ata automaticamente ao final da reunião</b></label>
      </div>

      <div class="gemini-actions">
        <button type="button" id="generate-last-ata-btn" class="btn-primary">Gerar Ata da última reunião</button>
        <a href="../meetings.html#ata-settings" target="_blank">Modelo &amp; Atas <span class="right-arrow">&rarr;</span></a>
      </div>
      <div id="ata-action-status" class="sub-text" style="margin-top: 0.5rem;"></div>
    </div>

    <div class="footer">
      <a href="../meetings.html" target="_blank">Histórico de reuniões <span class="right-arrow">&rarr;</span></a>
      <span id="version" class="sub-text"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
