<!-- popup/index.html -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>CommitJr Atas</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Poppins:wght@400;500;600;700&display=swap");

    :root {
      --cj-navy: #0c152d;
      --cj-surface: #132042;
      --cj-border: #233564;
      --cj-yellow: #fac835;
      --cj-yellow-hover: #ffd65c;
      --cj-mint: #95eed8;
      --cj-white: #ffffff;
      --cj-muted: #b8c2d9;
      --cj-subtle: #8fa0c4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 368px;
      margin: 0;
      padding: 1rem;
      background-color: var(--cj-navy);
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--cj-white);
      font-family: "Poppins", system-ui, -apple-system, sans-serif;
      font-size: 0.84rem;
      line-height: 1.45;
    }

    .brand-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.8rem 0.95rem;
      margin-bottom: 0.85rem;
      background: var(--cj-surface);
      border: 1px solid var(--cj-border);
      border-left: 3px solid var(--cj-yellow);
      border-radius: 8px;
    }

    .brand-header::after {
      content: "";
      position: absolute;
      top: 6px;
      right: 6px;
      width: 10px;
      height: 10px;
      border-top: 2px solid var(--cj-yellow);
      border-right: 2px solid var(--cj-yellow);
      border-top-right-radius: 2px;
      pointer-events: none;
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 0.18rem;
    }

    h1.brand-wordmark {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--cj-white);
    }

    h1.brand-wordmark .jr {
      color: var(--cj-yellow);
    }

    .brand-badge {
      display: inline-block;
      padding: 0.12rem 0.42rem;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.64rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--cj-mint);
      background: rgba(149, 238, 216, 0.1);
      border: 1px solid rgba(149, 238, 216, 0.35);
      border-radius: 4px;
    }

    .brand-subtitle {
      margin: 0;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.68rem;
      color: var(--cj-mint);
    }

    .mascot-frame {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cj-navy);
      border: 1.5px solid var(--cj-yellow);
      border-radius: 10px;
      padding: 5px;
    }

    .logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .card {
      padding: 0.85rem 0.95rem;
      background: var(--cj-surface);
      border: 1px solid var(--cj-border);
      border-radius: 8px;
      margin-bottom: 0.85rem;
      text-align: left;
    }

    .checkbox-group {
      display: flex;
      gap: 0.6rem;
      align-items: flex-start;
    }

    .checkbox-group label {
      margin: 0;
      font-weight: 600;
      color: var(--cj-white);
      cursor: pointer;
    }

    .helper-text {
      margin: 0.5rem 0 0;
      padding-top: 0.5rem;
      border-top: 1px solid var(--cj-border);
      color: var(--cj-muted);
      font-size: 0.74rem;
    }

    input[type="checkbox"] {
      accent-color: var(--cj-yellow);
      width: 17px;
      height: 17px;
      margin: 0.12rem 0 0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-primary-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      width: 100%;
      padding: 0.62rem 0.95rem;
      margin-bottom: 0.75rem;
      background: var(--cj-yellow);
      color: var(--cj-navy);
      border: 1px solid var(--cj-yellow);
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.84rem;
      text-decoration: none;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn-primary-link:hover {
      background: var(--cj-yellow-hover);
      border-color: var(--cj-yellow-hover);
      color: var(--cj-navy);
      text-decoration: none;
    }

    .footer-bar {
      display: flex;
      gap: 0.65rem;
      align-items: center;
      justify-content: space-between;
      padding: 0.1rem 0.1rem 0;
    }

    .footer-link {
      color: var(--cj-mint);
      font-weight: 600;
      font-size: 0.76rem;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .footer-link:hover {
      color: var(--cj-yellow);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .footer-meta {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.72rem;
      color: var(--cj-subtle);
    }

    .right-arrow {
      font-size: 0.95em;
    }
  </style>
</head>

<body>
  <header class="brand-header">
    <div class="header-text">
      <div class="brand-title-row">
        <h1 class="brand-wordmark">Commit<span class="jr">Jr</span></h1>
        <span class="brand-badge">ATAS</span>
      </div>
      <p class="brand-subtitle">&lt;Transcrições &amp; Atas • Google Meet/&gt;</p>
    </div>
    <div class="mascot-frame">
      <img class="logo" src="../icons/pull-mascot.svg" alt="Pull - Mascote Commit Jr." />
    </div>
  </header>

  <section class="card">
    <div class="checkbox-group">
      <input type="checkbox" id="hide-captions" />
      <label for="hide-captions">Ocultar legendas na tela do Google Meet</label>
    </div>
    <p class="helper-text">As transcrições das reuniões no Google Meet são capturadas automaticamente.</p>
  </section>

  <a id="open-meetings-btn" class="btn-primary-link" href="../meetings.html" target="_blank">
    Histórico de Atas &amp; Configurações <span class="right-arrow">&rarr;</span>
  </a>

  <footer class="footer-bar">
    <a class="footer-link" href="../meetings.html#ata-settings" target="_blank">Configurar Chave Gemini &amp; Modelo</a>
    <span class="footer-meta">Commit Jr.</span>
  </footer>

  <script src="popup.js"></script>
</body>

</html>
